<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1610"/>
      <stop offset="50%" stop-color="#050d08"/>
      <stop offset="100%" stop-color="#030805"/>
    </linearGradient>
    <linearGradient id="denimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#2a4d7d"/>
      <stop offset="100%" stop-color="#162c4a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <!-- Subtle grid and circular halo -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="#10b981" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="10 10"/>
  <circle cx="400" cy="400" r="260" fill="none" stroke="#a3e635" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Garment Torso Silhouette (Upcycled Denim Jacket) -->
  <g transform="translate(400, 420)">
    <!-- Main Jacket Body -->
    <path d="M -130,-160 L -180,-140 L -230,-60 L -210,130 L -170,120 L -140,-10 L -130,160 L 130,160 L 140,-10 L 170,120 L 210,130 L 230,-60 L 180,-140 L 130,-160 L 70,-130 L -70,-130 Z"
          fill="url(#denimGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.3"/>

    <!-- Collar -->
    <path d="M -80,-155 L -120,-115 L -60,-100 L 0,-120 L 60,-100 L 120,-115 L 80,-155 Z"
          fill="#162b47" stroke="#60a5fa" stroke-width="2"/>

    <!-- Front Placket / Button Seam -->
    <line x1="0" y1="-120" x2="0" y2="160" stroke="#f8fafc" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- Buttons -->
    <circle cx="0" cy="-70" r="5" fill="#facc15"/>
    <circle cx="0" cy="-20" r="5" fill="#facc15"/>
    <circle cx="0" cy="30" r="5" fill="#facc15"/>
    <circle cx="0" cy="80" r="5" fill="#facc15"/>
    <circle cx="0" cy="130" r="5" fill="#facc15"/>

    <!-- Left Pocket -->
    <rect x="-105" y="-50" width="60" height="65" rx="6" fill="#1b3456" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M -105,-50 L -75,-35 L -45,-50" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Right Pocket with Botanical Embroidery Patch -->
    <rect x="45" y="-50" width="60" height="65" rx="6" fill="#1b3456" stroke="#10b981" stroke-width="2"/>
    <!-- Botanical Motif on pocket -->
    <circle cx="75" cy="-20" r="14" fill="#042f2e" stroke="#34d399" stroke-width="1.5"/>
    <path d="M 75,-30 Q 82,-20 75,-10 Q 68,-20 75,-30" fill="url(#emeraldGrad)"/>
    <path d="M 68,-20 Q 75,-25 82,-20" fill="url(#limeGrad)"/>

    <!-- Left Sleeve Elbow Blowout Upcycle Patch (Sashiko geometric repair) -->
    <g transform="translate(-190, 30)">
      <rect x="-25" y="-35" width="50" height="70" rx="10" fill="#062e24" stroke="#34d399" stroke-width="2" filter="url(#softGlow)"/>
      <!-- Sashiko stitches -->
      <line x1="-20" y1="-25" x2="20" y2="-25" stroke="#fef08a" stroke-width="2" stroke-dasharray="4 4"/>
      <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#fef08a" stroke-width="2" stroke-dasharray="4 4"/>
      <line x1="-20" y1="5" x2="20" y2="5" stroke="#fef08a" stroke-width="2" stroke-dasharray="4 4"/>
      <line x1="-20" y1="20" x2="20" y2="20" stroke="#fef08a" stroke-width="2" stroke-dasharray="4 4"/>
      <!-- Cross stitches -->
      <path d="M -10,-18 L -6,-14 M -6,-18 L -10,-14" stroke="#34d399" stroke-width="2"/>
      <path d="M 6,-18 L 10,-14 M 10,-18 L 6,-14" stroke="#34d399" stroke-width="2"/>
      <path d="M -2,0 L 2,4 M 2,0 L -2,4" stroke="#a3e635" stroke-width="2"/>
    </g>

    <!-- Collar Botanical Embroidery Repair (Right Side) -->
    <path d="M 30,-125 C 45,-140 70,-130 65,-115 C 60,-100 40,-110 30,-125 Z" fill="url(#limeGrad)" stroke="#10b981" stroke-width="1.5"/>
  </g>

  <!-- High-Tech HUD Badges -->
  <g transform="translate(60, 80)">
    <rect width="210" height="42" rx="21" fill="#042116" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="6" fill="#34d399"/>
    <text x="42" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" letter-spacing="1">DALL-E 3 SYNTHESIS</text>
  </g>

  <g transform="translate(530, 80)">
    <rect width="210" height="42" rx="21" fill="#042116" stroke="#a3e635" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="6" fill="#a3e635"/>
    <text x="42" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#bef264" letter-spacing="1">REPAIR CONFIDENCE 99%</text>
  </g>

  <g transform="translate(400, 720)">
    <text text-anchor="middle" font-family="monospace" font-size="14" fill="#a7f3d0" letter-spacing="2">
      BESPOKE SASHIKO BLUEPRINT • ZERO FABRIC WASTE
    </text>
  </g>
</svg>
